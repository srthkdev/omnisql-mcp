name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run build
      - name: Install SQLite
        run: command -v sqlite3 || (sudo apt-get update && sudo apt-get install -y sqlite3)
      - run: bun run test
      - name: Check MCP result readers on both runtimes
        run: bun scripts/check-results.mjs && node scripts/check-results.mjs
      - name: Check large MCP catalogs on both runtimes
        run: bun scripts/check-catalogs.mjs && node scripts/check-catalogs.mjs
      - name: Check model-visible privacy on both runtimes
        run: bun scripts/check-privacy.mjs && node scripts/check-privacy.mjs
      - name: Verify packed npm CLI on both runtimes
        run: bun scripts/check-package.mjs && node scripts/check-package.mjs
      - run: bun audit --audit-level=high
      - run: bash -n scripts/install.sh && bash scripts/install.sh --help
      - uses: actions/upload-artifact@v4
        with:
          name: compiled-server
          path: dist/
  node:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        version: [22.15.0, 22.x, 24.x, 26.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.version }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - run: bun install --production --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: compiled-server
          path: dist/
      - run: node scripts/check-package.mjs
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun test --isolate tests/install-windows.test.ts
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - run: bun install --frozen-lockfile
      - run: bun run --cwd docs-site test
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        engine: [postgres, mysql, mariadb, mssql, oracle]
        runtime: [bun, node]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: ${{ matrix.runtime }} scripts/integration.mjs --engines=${{ matrix.engine }}
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - run: cargo fmt --manifest-path native/sql-policy/Cargo.toml --check
      - run: cargo clippy --locked --manifest-path native/sql-policy/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path native/sql-policy/Cargo.toml
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - run: cargo install wasm-pack --version 0.15.0 --locked
      - run: bun install --frozen-lockfile
      - run: bun run build:rust
      - run: git diff --exit-code -- 'src/native/*.js' 'src/native/*.d.ts' src/native/package.json
      - run: bun test --isolate tests/access-policy.test.ts tests/security-policy.test.ts tests/connections-config.test.ts tests/policy-identifiers.test.ts
      - uses: actions/upload-artifact@v4
        with:
          name: rust-wasm-linux
          path: src/native/
  duckdb:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        runtime: [bun, node]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - run: bun install --frozen-lockfile
      - name: Install verified DuckDB CLI 1.5.6
        env:
          DUCKDB_RELEASE: https://github.com/duckdb/duckdb/releases/download/v1.5.6/duckdb_cli-linux-amd64.gz
        run: |
          curl --fail --location --connect-timeout 10 --max-time 120 "$DUCKDB_RELEASE" -o "$RUNNER_TEMP/duckdb.gz"
          printf 'cce2687a38681db644c248198b99ecd86170ff47e324c5f33e50c0042f142839  %s\n' "$RUNNER_TEMP/duckdb.gz" | sha256sum --check
          gzip -dc "$RUNNER_TEMP/duckdb.gz" > "$RUNNER_TEMP/duckdb"
          chmod 700 "$RUNNER_TEMP/duckdb"
      - run: bun run build
      - run: ${{ matrix.runtime }} scripts/check-duckdb.mjs
        env:
          OMNISQL_DUCKDB_CLI: ${{ runner.temp }}/duckdb
  tls:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        runtime: [bun, node]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: ${{ matrix.runtime }} scripts/check-tls.mjs
      - run: ${{ matrix.runtime }} scripts/check-http-transport.mjs
  clickhouse:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        runtime: [bun, node]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: ${{ matrix.runtime }} scripts/check-clickhouse.mjs
