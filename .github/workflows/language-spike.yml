name: Language spike
on:
  pull_request:
    paths:
      - experiments/language-spike/**
      - .github/workflows/language-spike.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
          cache-dependency-path: experiments/language-spike/go/go.sum
      - run: bun install --production --frozen-lockfile --ignore-scripts
      - run: bun install --cwd experiments/language-spike/js --frozen-lockfile --ignore-scripts
      - run: cargo fmt --check --manifest-path experiments/language-spike/rust/Cargo.toml
      - run: cargo build --release --locked --manifest-path experiments/language-spike/rust/Cargo.toml
      - run: mkdir -p experiments/language-spike/bin
      - working-directory: experiments/language-spike/go
        run: go build -trimpath -ldflags='-s -w' -o ../bin/go-server .
      - run: node experiments/language-spike/run.mjs --verify
