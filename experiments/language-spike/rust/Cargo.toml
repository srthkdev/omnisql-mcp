[package]
name = "omnisql-language-spike"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
rmcp = { version = "=3.5.1", default-features = false, features = ["server", "transport-io", "macros", "schemars"] }
tokio = { version = "1", features = ["rt", "macros", "sync", "io-std"] }
tokio-postgres = "=0.7.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
sha2 = "=0.11.1"
futures-util = "0.3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
