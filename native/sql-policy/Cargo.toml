[package]
name = "omnisql-sql-policy"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/srthkdev/omnisql-mcp"
description = "Portable SQL analysis for OmniSQL access policies"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlparser = { version = "=0.63.0", features = ["visitor"] }
wasm-bindgen = "0.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
