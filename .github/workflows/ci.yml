name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Install SQLite for integration tests
        run: command -v sqlite3 || (sudo apt-get update && sudo apt-get install -y sqlite3)

      - name: Run tests
        run: npm test

      - name: Verify npm package
        run: npm run test:package

      - name: Check for vulnerabilities
        run: npm audit --audit-level=high

      - name: Validate installer
        run: bash -n scripts/install.sh && bash scripts/install.sh --help

      - name: Upload compiled server
        if: matrix.node-version == '22.x'
        uses: actions/upload-artifact@v4
        with:
          name: compiled-server
          path: dist/

  runtime:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: npm ci --omit=dev --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: compiled-server
          path: dist/
      - name: Verify runtime compatibility
        run: npm run test:package

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
      - run: npm ci
      - name: Type check
        run: npm run typecheck
